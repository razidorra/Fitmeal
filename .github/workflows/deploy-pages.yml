name: Deploy frontend to GitHub Pages

# Publishes only the static frontend (frontend/dist) to GitHub Pages. The Express API and MongoDB
# still need to run somewhere that can execute server code — GitHub Pages can only serve static
# files. Deploy backend/ separately (see docs/DEPLOYMENT.md) and point VITE_API_URL at it below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        env:
          GITHUB_PAGES: "true"
          # Set these as repository variables/secrets in Settings → Secrets and variables →
          # Actions once the backend is deployed (e.g. on Render — see docs/DEPLOYMENT.md).
          # Until VITE_API_URL is set, the deployed site's sign-in/planner/progress/assistant
          # features will fail — public pages (home, recipes) still work.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build -w frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
